name: Generate report
on:
  workflow_dispatch:
    inputs:
      mint:
        description: 'Solana token mint address (base58, 32-44 chars)'
        required: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: generate-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: npx tsx scripts/generate-report.ts "${{ inputs.mint }}"
      - name: Commit report
        run: |
          git config user.name "hoheee-bot"
          git config user.email "hoheee-bot@users.noreply.github.com"
          git add runs
          git commit -m "chore: add report $(ls -t runs/*.json | head -1 | xargs basename -s .json)" || echo "no changes"
          git pull --rebase --autostash || echo "rebase skipped"
          git push
      - name: Summary
        run: echo "Report generated for mint ${{ inputs.mint }} — Vercel rebuilds on push." >> "$GITHUB_STEP_SUMMARY"
